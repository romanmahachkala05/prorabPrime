# Project-wide Gradle settings.
# 4 GB, not 2: D8 runs out of heap merging dex for instrumented test APKs alongside
# two-target KMP compilation.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Each library's R class includes only its own resources.
android.nonTransitiveRClass=true
# The one version number: :app derives versionName and versionCode from it.
prorab.version=0.1.0

# Local infrastructure for the server. Reads credentials from `.env` (copy `.env.example`).
#
#   docker compose up -d      # start PostgreSQL
#   ./gradlew :server:run     # start the server against it
services:
  postgres:
    # 15+ is required: the cover-photo foreign key uses ON DELETE SET NULL (column).
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prorab
      POSTGRES_USER: ${DB_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?copy .env.example to .env}
    ports:
      # Loopback only: the phone talks to the server, never to the database.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d prorab"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

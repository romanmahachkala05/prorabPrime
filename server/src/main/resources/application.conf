# Every value can be overridden from the environment; see .env.example.
ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    application {
        modules = [ru.prorabprime.server.ApplicationKt.module]
    }
}

prorab {
    database {
        url = ${?DB_URL}
        user = ${?DB_USER}
        password = ${?DB_PASSWORD}
    }
    storage {
        dir = "./data/uploads"
        dir = ${?STORAGE_DIR}
    }
    auth {
        token = ${?API_TOKEN}
    }
}
